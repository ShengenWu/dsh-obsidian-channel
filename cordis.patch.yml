# dsh-obsidian-channel — bind a local Obsidian vault to DSH.
#
# First-time setup is usually done in the UI (sidebar 📓 or Settings → Obsidian).
# You can also set vaultDir here. Leave it empty to require a UI bind.

- insert:
    - id: dsh-obsidian-channel
      name: 'dsh-obsidian-channel'
      inject: [tools, fs, approval]
      config:
        vaultDir: ''
        # per-write | per-turn | auto
        writePolicy: per-write
        excludes: []
        journalRetentionDays: 30
        # Leave empty to follow .obsidian/daily-notes.json
        dailyFolder: ''
        dailyFormat: ''
